name: build-and-test
on: [push, pull_request]
jobs:
  platform-api:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgis/postgis:16-3.4, env: { POSTGRES_DB: egypt_health, POSTGRES_USER: health_admin, POSTGRES_PASSWORD: ci }, ports: ["5432:5432"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - working-directory: services/platform-api
        run: mvn -B verify
  analytics-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: services/analytics-ai
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
