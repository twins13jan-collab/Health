# Full-stack composition for the v6 rebuild. Services are wired by name;
# the platform API talks to analytics-ai over REST with correlation ids,
# to PostgreSQL with RLS session context, to Kafka for domain events,
# and to Keycloak for OIDC.
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: egypt_health, POSTGRES_USER: health_admin, POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me} }
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U health_admin"], interval: 5s, timeout: 3s, retries: 20 }
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-change-me} }
    ports: ["8180:8080"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment: { KAFKA_NODE_ID: 1, KAFKA_PROCESS_ROLES: broker,controller, KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER, KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  platform-api:
    build: ../services/platform-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/egypt_health
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      ANALYTICS_AI_BASE_URL: http://analytics-ai:8000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy }, kafka: { condition: service_started } }
  analytics-ai:
    build: ../services/analytics-ai
    ports: ["8000:8000"]
  web:
    build: ../apps/web
    environment: { NEXT_PUBLIC_API_BASE_URL: http://localhost:8080 }
    ports: ["3000:3000"]
    depends_on: [platform-api]
volumes: { db-data: {} }
