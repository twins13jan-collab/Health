# Full-stack composition for the v6 rebuild. Services are wired by name;
# the platform API talks to analytics-ai over REST with correlation ids,
# to PostgreSQL with RLS session context, to Kafka for domain events,
# and to Keycloak for OIDC.
# NOTE: environment blocks MUST stay in block (not flow) style — flow maps
# break on ${VAR} interpolation and on commas inside Kafka listener values.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: egypt_health
      POSTGRES_USER: health_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    # Loopback-only: services reach the DB over the compose network, not via the published port.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U health_admin"], interval: 5s, timeout: 3s, retries: 20 }
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # start-dev is for demos only; production needs start with a real DB + hostname.
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-change-me}
    ports: ["8180:8080"]
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durable cache storage: AOF persistence on a named volume.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis_data:/data"]
    ports: ["127.0.0.1:6379:6379"]
  platform-api:
    # NOTE: the Dockerfile copies a pre-built jar (target/platform-api-*.jar).
    # On a fresh clone run `mvn package` in services/platform-api FIRST
    # (see infra/EC2_DEPLOY.md) — otherwise this build fails: no jar to copy.
    build: ../services/platform-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/egypt_health
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      ANALYTICS_AI_BASE_URL: http://analytics-ai:8000
      APP_SETTINGS_KEY: ${APP_SETTINGS_KEY:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy }, kafka: { condition: service_started } }
  analytics-ai:
    build: ../services/analytics-ai
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      PLATFORM_API_BASE_URL: http://platform-api:8080
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [ollama]
  # Local open-source LLM serving (Ollama). Internal only — never
  # published; the model runs inside the deployment so no data
  # leaves the infrastructure for AI. Model weights live in the
  # ollama_data volume; pull with: docker exec infra-ollama-1 ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: ["ollama_data:/root/.ollama"]
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is inlined at build time — this arg is what makes the
      # browser call the EC2 host instead of localhost:8080.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on: [platform-api]
volumes:
  db-data: {}
  ollama_data: {}
  redis_data: {}
